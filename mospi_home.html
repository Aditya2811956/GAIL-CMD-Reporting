    // Fix lang attribute based on domain
    (function() {

      // Check if it's the Hindi IDN domain
      var hindiDomains = [

        'एमओएसपीआई.सरकार.भारत'  // Unicode form

        return hostname.indexOf(d) !== -1;
      });
      
      if (isHindi) {
        document.documentElement.lang = 'hi';
        document.documentElement.dir = 'ltr'; // Hindi is LTR
      }
    })();
