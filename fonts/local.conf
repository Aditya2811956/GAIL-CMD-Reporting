<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map Calibri → Carlito (metrically identical, used by LibreOffice) -->
  <alias>
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias>
    <family>Calibri Light</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
</fontconfig>
